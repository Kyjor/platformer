name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: platformer-linux-x64
          - os: macos-latest
            artifact: platformer-macos-arm64
          - os: windows-latest
            artifact: platformer-windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - uses: julia-actions/cache@v2

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc patchelf libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libgl1-mesa-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_image sdl2_mixer dylibbundler pkg-config

      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-ntldd

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_B64" ]; then
            echo "MACOS_CERT_P12 secret is missing"
            exit 1
          fi
          echo "$MACOS_CERT_P12_B64" | base64 --decode > dev_id.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import dev_id.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm -f dev_id.p12

      - name: Place App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Compile and package
        if: runner.os != 'Windows'
        run: bash ci/build.sh

      - name: Compile and package
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash ci/build.sh

      - name: Sign and notarize
        if: runner.os == 'macOS'
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY || 'Developer ID Application: Kyle Conel (AKG5NATH99)' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'AKG5NATH99' }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: bash ci/sign_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    name: Publish latest
    needs: build
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: platformer-*
          merge-multiple: false

      - name: Update the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          zips=(artifacts/**/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No builds to publish"
            exit 0
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${zips[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Unzip a platform archive and run the game. On macOS, open Platformer.app (signed by Kyle Conel / AKG5NATH99)."
